[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dhizuku-cli"
version = "1.0.0"
description = "Dhizuku Device Owner command-line client over TCP with TOTP authentication"
readme = "README.md"
requires-python = ">=3.6"
license = { text = "GPL-3.0" }
authors = [
    { name = "nsyhykui" }
]
keywords = ["dhizuku", "device-owner", "cli", "android", "tcp", "totp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.6",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Utilities",
]
dependencies = [
    "cryptography>=3.0",
]

[project.urls]
Homepage = "https://github.com/nsyhykui/dhizuku-cli"
Source = "https://github.com/nsyhykui/dhizuku-cli"

[project.scripts]
dcli = "dhizuku_cli.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["dhizuku_cli*"]
